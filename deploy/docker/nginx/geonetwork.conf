# TLS termination in front of the GeoNetwork container.
#
# Terminating TLS here rather than in Tomcat keeps the catalogue image free of
# certificates and makes renewal a file swap rather than a rebuild.
#
# It also gives a redirect that a Tomcat connector does not. `redirectPort` on
# an HTTP connector is widely read as an HTTP-to-HTTPS redirect and is not one:
# it applies only to requests for a resource declaring a CONFIDENTIAL transport
# guarantee in web.xml. Everything else stays on plain HTTP. The :80 server
# block below redirects unconditionally.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Everything, unconditionally. No exception for ACME: if you move to
    # automatic certificates, add the .well-known location here explicitly
    # rather than loosening this.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # api.params.maxUploadSize in the deployed config is 100000000, so anything
    # smaller here would reject uploads the catalogue itself accepts.
    client_max_body_size 100m;

    # Metadata harvesting and reindexing can both outlast the default 60s.
    proxy_connect_timeout 60s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    location / {
        proxy_pass http://geonetwork:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Without this GeoNetwork builds http:// URLs for a site served over
        # https, and the browser blocks them as mixed content. It is necessary
        # but not sufficient — see the note on Settings > System > Server in
        # ../README.md.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  443;

        # The catalogue sets no WebSocket upgrades today; these are harmless and
        # keep a future one working.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "";
    }

    # Only the catalogue needs to be reachable through this proxy. Sending the
    # bare root to /geonetwork means a stray ROOT webapp is never served, whatever
    # ends up in Tomcat's webapps directory.
    location = / {
        return 302 /geonetwork;
    }
}
